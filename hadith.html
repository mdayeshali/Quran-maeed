<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>বাংলা হাদিস | Islamic Light</title>

    <meta name="description"
          content="ইসলামিক লাইটে বাংলা হাদিস পড়ুন। নির্ভরযোগ্য হাদিস, ব্যাখ্যা ও তথ্য সহজভাবে পড়ুন।">

    <meta name="theme-color" content="#004d40">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        /* =========================================
           Islamic Light - Hadith Page
           ========================================= */

        :root {
            --primary: #004d40;
            --primary-dark: #00352d;
            --primary-light: #e8f5f2;
            --accent: #c8a951;

            --text: #263238;
            --muted: #607d7b;

            --background: #f5f8f7;
            --card: #ffffff;
            --border: #dce7e4;

            --shadow:
                0 8px 25px rgba(0, 77, 64, 0.08);

            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Noto Sans Bengali", sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.8;
        }

        /* =========================================
           Header
           ========================================= */

        .hadith-header {
            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary)
                );

            color: white;
            padding: 32px 16px 38px;
            text-align: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .hadith-header-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);

            font-size: 28px;
        }

        .hadith-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .hadith-header p {
            font-size: 14px;
            opacity: 0.88;
        }

        /* =========================================
           Main
           ========================================= */

        .container {
            width: min(900px, 92%);
            margin: -18px auto 40px;
            position: relative;
        }

        /* =========================================
           Search
           ========================================= */

        .search-box {
            background: var(--card);

            padding: 14px;

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            display: flex;
            gap: 10px;

            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 12px 14px;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            background: #fafdfc;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            border: none;

            background: var(--primary);

            color: white;

            border-radius: 12px;

            padding: 0 20px;

            font-family: inherit;

            cursor: pointer;

            transition: 0.2s;
        }

        .search-box button:hover {
            background: var(--primary-dark);
        }

        /* =========================================
           Status
           ========================================= */

        .status {
            text-align: center;

            color: var(--muted);

            font-size: 14px;

            margin: 15px 0;
        }

        .loader {
            width: 35px;
            height: 35px;

            margin: 20px auto;

            border: 4px solid #d9e8e4;

            border-top-color: var(--primary);

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #fff4f4;

            border: 1px solid #ffd2d2;

            color: #a33;

            padding: 15px;

            border-radius: 12px;

            text-align: center;
        }

        /* =========================================
           Hadith Card
           ========================================= */

        .hadith-card {
            background: var(--card);

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            overflow: hidden;

            border: 1px solid var(--border);
        }

        .card-top {
            background: var(--primary-light);

            padding: 18px 20px;

            border-bottom: 1px solid var(--border);
        }

        .book-name {
            color: var(--primary);

            font-size: 14px;

            font-weight: 700;
        }

        .hadith-number {
            display: inline-block;

            margin-top: 6px;

            padding: 4px 10px;

            border-radius: 20px;

            background: white;

            color: var(--muted);

            font-size: 12px;
        }

        .card-body {
            padding: 24px 22px;
        }

        .hadith-title {
            color: var(--primary);

            font-size: 21px;

            line-height: 1.6;

            margin-bottom: 18px;

            font-weight: 700;
        }

        .hadith-text {
            font-size: 17px;

            line-height: 2.15;

            color: #263238;

            white-space: pre-line;
        }

        .explanation {
            margin-top: 22px;

            padding: 17px;

            border-right: 4px solid var(--accent);

            background: #faf8ef;

            border-radius: 10px;

            font-size: 15px;

            color: #4e4e45;
        }

        .explanation-title {
            color: #806b27;

            font-weight: 700;

            margin-bottom: 6px;
        }

        /* =========================================
           Source
           ========================================= */

        .source-box {
            padding: 16px 22px;

            background: #fafcfb;

            border-top: 1px solid var(--border);

            font-size: 13px;

            color: var(--muted);
        }

        .source-box a {
            color: var(--primary);

            font-weight: 600;

            text-decoration: none;
        }

        .source-box a:hover {
            text-decoration: underline;
        }

        /* =========================================
           Navigation
           ========================================= */

        .navigation {
            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-top: 18px;
        }

        .nav-btn {
            flex: 1;

            border: 1px solid var(--border);

            background: white;

            color: var(--primary);

            padding: 12px;

            border-radius: 12px;

            font-family: inherit;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary);

            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.45;

            cursor: not-allowed;
        }

        /* =========================================
           Footer
           ========================================= */

        .page-footer {
            text-align: center;

            margin-top: 28px;

            color: var(--muted);

            font-size: 13px;
        }

        /* =========================================
           Mobile
           ========================================= */

        @media (max-width: 600px) {

            .hadith-header {
                padding: 25px 14px 32px;
            }

            .hadith-header h1 {
                font-size: 23px;
            }

            .container {
                width: 94%;
            }

            .search-box {
                padding: 10px;
            }

            .search-box button {
                padding: 0 14px;
            }

            .card-body {
                padding: 20px 17px;
            }

            .hadith-title {
                font-size: 19px;
            }

            .hadith-text {
                font-size: 16px;
                line-height: 2;
            }

            .navigation {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         Header
         ========================================= -->

    <header class="hadith-header">

        <div class="hadith-header-icon">
            📖
        </div>

        <h1>বাংলা হাদিস</h1>

        <p>
            কুরআন ও সুন্নাহর জ্ঞান সহজভাবে পড়ুন
        </p>

    </header>


    <!-- =========================================
         Main
         ========================================= -->

    <main class="container">

        <!-- Search -->

        <div class="search-box">

            <input
                type="number"
                id="hadithId"
                min="1"
                placeholder="হাদিস নম্বর লিখুন..."
                aria-label="হাদিস নম্বর"
            >

            <button onclick="loadHadith()">
                দেখুন
            </button>

        </div>


        <!-- Status -->

        <div id="status" class="status"></div>


        <!-- Hadith -->

        <article
            id="hadithCard"
            class="hadith-card"
            style="display:none;"
        >

            <div class="card-top">

                <div
                    id="bookName"
                    class="book-name"
                ></div>

                <div
                    id="hadithNumber"
                    class="hadith-number"
                ></div>

            </div>


            <div class="card-body">

                <h2
                    id="hadithTitle"
                    class="hadith-title"
                ></h2>


                <div
                    id="hadithText"
                    class="hadith-text"
                ></div>


                <div
                    id="explanationBox"
                    class="explanation"
                    style="display:none;"
                >

                    <div class="explanation-title">
                        ব্যাখ্যা
                    </div>

                    <div id="explanation"></div>

                </div>

            </div>


            <div class="source-box">

                উৎস:
                <a
                    href="https://hadeethenc.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    HadeethEnc.com
                </a>

            </div>

        </article>


        <!-- Navigation -->

        <div
            id="navigation"
            class="navigation"
            style="display:none;"
        >

            <button
                id="prevBtn"
                class="nav-btn"
                onclick="previousHadith()"
            >
                ← আগের হাদিস
            </button>


            <button
                id="nextBtn"
                class="nav-btn"
                onclick="nextHadith()"
            >
                পরের হাদিস →
            </button>

        </div>


        <footer class="page-footer">

            Islamic Light —
            ইসলামী জ্ঞান সহজভাবে সবার কাছে পৌঁছে দেওয়ার একটি উদ্যোগ।

        </footer>

    </main>


    <!-- =========================================
         JavaScript
         ========================================= -->

    <script>

        const API_URL =
            "https://hadeethenc.com/api/v1/hadeeths/one/";

        let currentId = 1;


        /*
         * হাদিস লোড করার function
         */

        async function loadHadith(id = null) {

            const input =
                document.getElementById("hadithId");

            if (id !== null) {

                currentId = id;

                input.value = id;

            } else {

                const enteredId =
                    parseInt(input.value);

                if (
                    !enteredId ||
                    enteredId < 1
                ) {

                    showError(
                        "সঠিক হাদিস নম্বর লিখুন।"
                    );

                    return;
                }

                currentId = enteredId;
            }


            const status =
                document.getElementById("status");

            const card =
                document.getElementById("hadithCard");

            const navigation =
                document.getElementById("navigation");


            card.style.display = "none";

            navigation.style.display = "none";


            status.innerHTML =
                '<div class="loader"></div>' +
                "হাদিস লোড হচ্ছে...";


            try {

                const response =
                    await fetch(
                        `${API_URL}?language=bn&id=${currentId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "API response failed"
                    );

                }


                const data =
                    await response.json();


                /*
                 * API response পরীক্ষা
                 */

                if (!data) {

                    throw new Error(
                        "হাদিস পাওয়া যায়নি"
                    );

                }


                displayHadith(data);


                status.innerHTML = "";

                card.style.display = "block";

                navigation.style.display = "flex";


            } catch (error) {

                console.error(error);

                showError(
                    "হাদিস লোড করা সম্ভব হচ্ছে না। " +
                    "কিছুক্ষণ পরে আবার চেষ্টা করুন।"
                );

            }

        }


        /*
         * হাদিস প্রদর্শন
         */

        function displayHadith(data) {

            document.getElementById("bookName")
                .textContent =
                data.book_name ||
                data.book ||
                "হাদিস";


            document.getElementById("hadithNumber")
                .textContent =
                "হাদিস: " +
                (
                    data.hadeeth_id ||
                    data.id ||
                    currentId
                );


            document.getElementById("hadithTitle")
                .textContent =
                data.title ||
                "হাদিস";


            document.getElementById("hadithText")
                .textContent =
                data.hadeeth ||
                data.matn ||
                data.text ||
                "হাদিসের তথ্য পাওয়া যায়নি।";


            /*
             * Explanation
             */

            const explanationBox =
                document.getElementById(
                    "explanationBox"
                );

            const explanation =
                document.getElementById(
                    "explanation"
                );


            if (data.explanation) {

                explanation.textContent =
                    data.explanation;

                explanationBox.style.display =
                    "block";

            } else {

                explanationBox.style.display =
                    "none";

            }

        }


        /*
         * Error
         */

        function showError(message) {

            document.getElementById("status")
                .innerHTML =
                `<div class="error">${message}</div>`;

        }


        /*
         * Previous
         */

        function previousHadith() {

            if (currentId <= 1) return;

            loadHadith(currentId - 1);

        }


        /*
         * Next
         */

        function nextHadith() {

            loadHadith(currentId + 1);

        }


        /*
         * Enter key
         */

        document
            .getElementById("hadithId")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        loadHadith();

                    }

                }
            );


        /*
         * প্রথম হাদিস
         */

        loadHadith(1);

    </script>

</body>
  </html>
