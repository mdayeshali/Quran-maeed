<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>প্রজেক্ট হোম | কুরআন অ্যাপ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #065f46;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .btn-link {
      display: inline-block;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background-color: #059669;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s ease;
      font-size: 1.05rem;
    }
    .btn-link:hover {
      background-color: #047857;
    }
    .path-checklist {
      margin-top: 2rem;
      text-align: left;
      background: #f8fafc;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #475569;
    }
    .path-checklist code {
      color: #0f766e;
      background: #e6fffa;
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>আল-কুরআন ওয়েব অ্যাপ</h1>
    <p>কুরআন তিলাওয়াত, উচ্চারণ ও বাংলা অনুবাদের মূল পেজে যেতে নিচের লিংকে ক্লিক করুন।</p>
    
    <!-- কুরআন পেজের মূল লিংক -->
    <a href="quran/quran.html" class="btn-link">কুরআন পেজ ওপেন করুন &rarr;</a>

    <div class="path-checklist">
      <strong>প্রজেক্ট ফাইল স্ট্রাকচার:</strong>
      <ul style="margin-top: 0.5rem; padding-left: 1.2rem;">
        <li>রুট ফাইল: <code>index.html</code></li>
        <li>মূল পেজ: <code>quran/quran.html</code></li>
        <li>আরবি ডাটা: <code>data/quran-uthmani.json</code></li>
        <li>লজিক: <code>js/quran.js</code></li>
        <li>স্টাইল: <code>css/quran.css</code></li>
      </ul>
    </div>
  </div>

</body>
</html>
