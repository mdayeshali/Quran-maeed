<!-- =========================================
     Islamic Light
     Dynamic Update Banner
     ========================================= -->

<section class="update-section" id="updateSection">

    <div class="update-card" id="updateCard">

        <!-- Left Icon -->

        <div class="update-icon" id="updateIcon">
            ✦
        </div>


        <!-- Content -->

        <div class="update-content">

            <div class="update-top">

                <span class="update-badge">

                    <span class="update-dot"></span>

                    <span id="updateBadge">
                        নতুন আপডেট
                    </span>

                </span>


                <span
                    class="update-date"
                    id="updateDate"
                >
                    আজ
                </span>

            </div>


            <h2
                class="update-title"
                id="updateTitle"
            >
                নতুন আপডেট
            </h2>


            <p
                class="update-description"
                id="updateDescription"
            >
                ইসলামিক লাইটে নতুন কিছু যুক্ত হয়েছে।
            </p>


            <div class="update-bottom">

                <div class="update-progress">

                    <span id="updateNumber">
                        1 / 3
                    </span>

                </div>


                <a
                    href="#"
                    class="update-button"
                    id="updateButton"
                >

                    <span id="updateButtonText">
                        দেখুন
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </a>

            </div>

        </div>


        <!-- Navigation -->

        <div class="update-navigation">

            <button
                type="button"
                class="update-nav prev"
                id="updatePrev"
                aria-label="Previous update"
            >
                ‹
            </button>


            <button
                type="button"
                class="update-nav next"
                id="updateNext"
                aria-label="Next update"
            >
                ›
            </button>

        </div>

    </div>


    <!-- Dots -->

    <div
        class="update-dots"
        id="updateDots"
    ></div>

</section>
